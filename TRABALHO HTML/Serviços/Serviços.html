<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Serviços</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: white;
    padding: 30px;
}

h2 {
    text-align: center;
    margin-top: 40px;
}

.tabela {
    width: 70%;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.tabela th {
    background-color: #3b82f6;
    padding: 12px;
    text-transform: uppercase;
}

.tabela td {
    padding: 12px;
    border-bottom: 1px solid #334155;
}

.tabela tr:hover {
    background-color: #334155;
}

.preco {
    color: #22c55e;
    font-weight: bold;
}

.btn-voltar {
    position: fixed;
    top: 20px;
    left: 20px;
}

</style>

</head>
<body>

<h2>💻 Valores – Sites Estáticos</h2>

<table class="tabela">
    <tr>
        <th>Quantidade de Páginas</th>
        <th>Preço</th>
    </tr>

    <tr>
        <td>Site de 1 a 2 páginas</td>
        <td class="preco">R$ 300,00</td>
    </tr>

    <tr>
        <td>Site de 3 a 5 páginas</td>
        <td class="preco">R$ 600,00</td>
    </tr>

    <tr>
        <td>Mais de 5 páginas</td>
        <td class="preco">R$ 1000,00</td>
    </tr>
</table>

<h2>⚙️ Valores – Sites Dinâmicos e Avançados</h2>

<table class="tabela">
    <tr>
        <th>Tipo de Site</th>
        <th>Preço</th>
    </tr>

    <tr>
        <td>Site dinâmico</td>
        <td class="preco">R$ 1.500,00</td>
    </tr>

    <tr>
        <td>Site avançado</td>
        <td class="preco">R$ 2.500,00</td>
    </tr>
    
    <a href="../index.html" class="btn-voltar">⬅ Voltar para o início</a>
</table>

</body>
</html>
