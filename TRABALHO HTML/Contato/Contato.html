<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background-color: #1b1b1b;
            padding: 30px;
            border: 1px solid #444;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #222;
            color: white;
        }

        .radio-group,
        .checkbox-group {
            margin-top: 5px;
        }

        .radio-group input,
        .checkbox-group input {
            width: auto;
            margin-right: 5px;
        }

        .radio-group label,
        .checkbox-group label {
            display: inline-block;
            margin-right: 15px;
        }

        .btn {
            margin-top: 20px;
            background-color: #2d6cdf;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1f4ea8;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            background-color: #444;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .voltar:hover {
            background-color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contato</h1>
        <p>Preencha o formulário para solicitar seu serviço.</p>

        <form>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(27) 99999-9999">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@gmail.com">

            <label>Tipo de cliente:</label>
            <div class="radio-group">
                <input type="radio" id="fisica" name="cliente" value="fisica">
                <label for="fisica">Pessoa Física</label>

                <input type="radio" id="juridica" name="cliente" value="juridica">
                <label for="juridica">Pessoa Jurídica</label>
            </div>

            <label for="horario">Melhor horário para contato:</label>
            <select id="horario" name="horario">
                <option>Manhã</option>
                <option>Tarde</option>
                <option>Noite</option>
            </select>

            <label>Tipo de serviço desejado:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="estatica" name="servico" value="estatica">
                <label for="estatica">Página Estática</label>

                <input type="checkbox" id="dinamica" name="servico" value="dinamica">
                <label for="dinamica">Página Dinâmica</label>

                <input type="checkbox" id="avancado" name="servico" value="avancado">
                <label for="avancado">Site Avançado</label>
            </div>

            <label for="descricao">Breve descrição do que deseja contratar:</label>
            <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva o serviço desejado"></textarea>

            <input type="submit" value="Enviar" class="btn">
        </form>

        <a href="../index.html" class="voltar">Voltar para o início</a>
    </div>

</body>
</html>
