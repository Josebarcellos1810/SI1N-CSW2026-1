<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<style>
.github {
    text-align: center;
    margin-top: 20px;
}

.github img {
    width: 40px;
    cursor: pointer;
    transition: 0.3s;
}

.github img:hover {
    transform: scale(1.2);
}
.github img {
    width: 250px;
}

.btn-voltar {
    display: inline-block;
    padding: 10px 20px;
    background-color: #3b5998;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
}

.btn-voltar:hover {
    background-color: #2d4373;
}
</style>

</head>

<body>

<div class="github">
    <a href="https://github.com/Josebarcellos1810" target="_blank">
        <img src="../Imagens/Github.png" alt="GitHub">
    </a>
</div>

<a href="../index.html" class="btn-voltar">Voltar</a>
</body>
</html>
